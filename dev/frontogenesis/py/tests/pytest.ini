[pytest]
# dev/frontogenesis/py/tests -- run with the project env:
#   /Users/xavier/miniforge3/envs/frontogenesis/bin/python -m pytest dev/frontogenesis/py/tests
markers =
    needs_grid: needs the M0 stores on disk (data/tile330_grid.zarr, and for some tests the 2 h raw store); skipped when absent
    network: pulls from OSN (coding doc §5); never run by default
addopts = --strict-markers -m "not network"
