# ---------------------------------------------------------------------------
# build_v5 -- SURF pipeline, globals_for_chunks dataset, step 4.
#
# Three snapshots whose fronts already exist under Fronts/V5/SURF/.  Step 4
# builds every SURF subset that is not already complete, then co-locates the
# fronts with every channel those subsets hold, reading each field straight
# from its zarr store.
#
#   python build_v5.py 4 run_v5_chunks_colocate.yaml
#
# Stores land beside the frontal_structure.zarr that is already there:
#   s3://dbof/globals_for_chunks/V5/{YYYYMMDD_HHMMSS}/{subset}.zarr
#
# frontal_structure.zarr is complete for these dates, so generation skips it
# and builds the other five.  Nothing is exported to NetCDF -- co-location
# reads the stores directly.
#
# Output, per snapshot:
#   $OS_OGCM/LLC/Fronts/V5/SURF/{YYYYMMDD_HHMMSS}/
#       front_properties_{TS}_V5_bfronts.parquet
#
# Push the products to S3 afterwards with:
#   python build_v5.py 5 run_v5_chunks_colocate.yaml
# ---------------------------------------------------------------------------

pipeline: "SURF"

run:
  # The dataset tag.  Locates the zarr stores on S3 and is stamped into every
  # output filename; the output *directory* comes from build_v5.py's version.
  run_id: "V5"
  log_dir: "./logs/"

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  # Stores live at {bucket}/{folder}/{run_id}/{date_prefix}/{subset}.zarr, i.e.
  #   s3://dbof/globals_for_chunks/V5/20120918_120000/kinematic.zarr
  # Without this key the folder would resolve to surface_fields/ for SURF.
  folder: "globals_for_chunks/"

runtime:
  zarr_async_concurrency: 8
  dask_scheduler: "distributed"
  dask_n_workers: 4
  dask_threads_per_worker: 4

# ---------------------------------------------------------------------------
# Every SURF subset.  Channel lists live in
# dbof.global_dataset_creation.subset_definitions, keyed by pipeline.
# ---------------------------------------------------------------------------
active_subsets:
  - frontal_structure   # gradb2, gradsalt2, gradtheta2, gradeta2, gradrho2,
                        # turner_angle, density, buoyancy
  - kinematic           # relative_vorticity, strain_n, strain_s, strain_mag,
                        # divergence, coriolis_f, rossby_number, okubo_weiss
  - frontogenesis       # frontogenesis_tendency, frontogenesis_geo,
                        # frontogenesis_ageo, ug, vg
  - native_fields       # Theta, Salt, Eta, W, U, V
  - surface_wind        # oceTAUX, oceTAUY, wind_stress_curl, ekman_pumping,
                        # u_ekman, v_ekman
  - icearea             # SIarea

# ---------------------------------------------------------------------------
# build_v5 knobs.  Every key has a default in
# fronts.properties.run.BUILD_DEFAULTS, so this block is optional.
# ---------------------------------------------------------------------------
build:
  # Front-finding config the fronts were made with -- it is how step 4 finds
  # the label map on disk.
  finding_config: "D"

  # The fronts already on disk were found on the unmasked gradb2 field; the
  # mask is applied here, to the fields the fronts are co-located with.  This
  # reads SIarea from icearea.zarr for the same run_id and date, which is why
  # icearea is in active_subsets above.
  ice_mask_find:  false
  ice_mask_props: true

  # Extra percentile columns per co-located channel, alongside mean/std/median.
  percentiles: [25, 75, 90]

  # Read each field from its zarr store and never write it to disk.
  colocate_source: zarr

data:
  # ISO 'YYYY-MM-DD HH:MM:SS'.
  date_iterations:
    - '2012-02-29 18:00:00'
    - '2012-05-16 06:00:00'
    - '2012-09-18 11:00:00'
