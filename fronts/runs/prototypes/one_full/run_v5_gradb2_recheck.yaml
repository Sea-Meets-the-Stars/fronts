# ---------------------------------------------------------------------------
# build_v5 -- one date, one subset: regenerate gradb2 and compare it against
# the copy already stored under run_id v2_2_01.
#
# run_id is deliberately NOT v2_2_01, so the new store lands beside the old one
# and nothing is overwritten:
#   s3://dbof/globals_for_cutouts/v2_2_01_recheck/20111204_000000/frontal_structure.zarr
#
# Before running, make sure the dbof that is *imported* is the one you think it
# is -- that is the whole point of the test:
#
#   cd ../../../../llc4320-native-grid-preprocessing
#   git checkout main && git pull
#   pip install -e .
#   python -c "import dbof, subprocess; print(dbof.__file__)"
#
#   python build_v5.py 1 run_v5_gradb2_recheck.yaml
#
# Then run section 8 of fronts/properties/nb/Colocate_Check.ipynb.
# ---------------------------------------------------------------------------

pipeline: "SURF"

run:
  run_id: "v2_2_01_recheck"
  log_dir: "./logs/"

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  folder: "globals_for_cutouts/"

runtime:
  zarr_async_concurrency: 8
  dask_scheduler: "distributed"
  dask_n_workers: 4
  dask_threads_per_worker: 4

active_subsets:
  - frontal_structure   # gradb2, gradsalt2, gradtheta2, gradeta2, gradrho2,
                        # turner_angle, density, buoyancy

build:
  finding_config: "D"
  ice_mask_find:  false
  ice_mask_props: false

data:
  date_iterations:
    - '2011-12-04 00:00:00'
