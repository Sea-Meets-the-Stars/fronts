# ---------------------------------------------------------------------------
# build_v5 -- SURF pipeline, globals_for_chunks dataset, Gulf Stream chunk.
#
# 32 snapshots: every 3 hours over four days, 2012-03-01 00Z to 2012-03-04 21Z.
# These are the same dates transferred for the gulf_stream chunk by
# llc4320-native-grid-preprocessing/configs/transfer/run_chunks_gulf_stream.yaml
# (tile 333; 75W, 30N).  Fronts are found on the FULL GLOBAL field -- the chunk
# is only where the tile co-location happens afterwards.
#
# Steps 1-3 and 5 only.  No co-location, so frontal_structure is the only
# subset needed and nothing but gradb2 is ever exported.
#
# Produces, per snapshot:
#     LLC4320_{timestamp}_gradb2_V5.nc      (step 1)
#     LLC4320_{timestamp}_V5_bfronts.npy    (step 2)
#     the label map + front-group tables       (step 3)
#
# under $OS_OGCM/LLC/Fronts/V5/SURF/{YYYYMMDD_HHMMSS}/, then copied back to
# s3://dbof/globals_for_chunks/V5/{YYYYMMDD_HHMMSS}/Fronts/  (step 5).
#
# Step 1 builds frontal_structure.zarr if it is not already complete, then
# exports gradb2 from it.  SURF reads Theta/Salt/Eta from the OSN kerchunk
# endpoint, so no transferred global store is required for these dates.
#
#   python build_v5.py 1 run_v5_gulf_stream_chunks.yaml   # build store + export gradb2
#   python build_v5.py 2 run_v5_gulf_stream_chunks.yaml   # find
#   python build_v5.py 3 run_v5_gulf_stream_chunks.yaml   # group
#   python build_v5.py 5 run_v5_gulf_stream_chunks.yaml   # push to S3
#
# To try one timestep first, comment out the other dates below.
# ---------------------------------------------------------------------------

pipeline: "SURF"

run:
  # The dataset tag.  Locates the zarr stores on S3 and is stamped into every
  # output filename; the output *directory* comes from build_v5.py's version.
  run_id: "V5"
  log_dir: "./logs/"

output:
  s3_endpoint: "https://s3-west.nrp-nautilus.io"
  bucket: "dbof/"
  # Stores live at {bucket}/{folder}/{run_id}/{date_prefix}/{subset}.zarr, i.e.
  #   s3://dbof/globals_for_chunks/V5/20120301_000000/frontal_structure.zarr
  # Without this key the folder would resolve to surface_fields/ for SURF.
  folder: "globals_for_chunks/"

runtime:
  zarr_async_concurrency: 8
  dask_scheduler: "distributed"
  dask_n_workers: 4
  dask_threads_per_worker: 4

# ---------------------------------------------------------------------------
# Subsets.  frontal_structure owns gradb2, which is all steps 1-3 read.
# icearea is absent because no masking is applied; add it if you turn a mask on.
# ---------------------------------------------------------------------------
active_subsets:
  - frontal_structure   # gradb2, gradsalt2, gradtheta2, gradeta2, gradrho2,
                        # turner_angle, density, buoyancy
  - icearea

# ---------------------------------------------------------------------------
# build_v5 knobs.  Every key has a default in
# fronts.properties.run.BUILD_DEFAULTS, so this block is optional.
# ---------------------------------------------------------------------------
build:
  # Products land in $OS_OGCM/LLC/Fronts/V5/SURF/ -- the V5 comes from
  # build_v5.py itself, not from here.

  # Front-finding config -> fronts/finding/configs/finding_config_D.yaml
  finding_config: "D"

  # No masking: fronts are found on the raw gradb2 field.  Turning either flag
  # on requires icearea.zarr for the same run_id and date, and icearea added to
  # active_subsets above.
  ice_mask_find:  false
  ice_mask_props: false

data:
  # ISO 'YYYY-MM-DD HH:MM:SS'.  One entry per {YYYYMMDDTHH}.zarr raw store.
  date_iterations:
    # -- 2012-03-01, 00Z-21Z --------------------------------------
    - '2012-03-01 00:00:00'
    - '2012-03-01 03:00:00'
    - '2012-03-01 06:00:00'
    - '2012-03-01 09:00:00'
    - '2012-03-01 12:00:00'
    - '2012-03-01 15:00:00'
    - '2012-03-01 18:00:00'
    - '2012-03-01 21:00:00'
    # -- 2012-03-02, 00Z-21Z --------------------------------------
    - '2012-03-02 00:00:00'
    - '2012-03-02 03:00:00'
    - '2012-03-02 06:00:00'
    - '2012-03-02 09:00:00'
    - '2012-03-02 12:00:00'
    - '2012-03-02 15:00:00'
    - '2012-03-02 18:00:00'
    - '2012-03-02 21:00:00'
    # -- 2012-03-03, 00Z-21Z --------------------------------------
    - '2012-03-03 00:00:00'
    - '2012-03-03 03:00:00'
    - '2012-03-03 06:00:00'
    - '2012-03-03 09:00:00'
    - '2012-03-03 12:00:00'
    - '2012-03-03 15:00:00'
    - '2012-03-03 18:00:00'
    - '2012-03-03 21:00:00'
    # -- 2012-03-04, 00Z-21Z --------------------------------------
    - '2012-03-04 00:00:00'
    - '2012-03-04 03:00:00'
    - '2012-03-04 06:00:00'
    - '2012-03-04 09:00:00'
    - '2012-03-04 12:00:00'
    - '2012-03-04 15:00:00'
    - '2012-03-04 18:00:00'
    - '2012-03-04 21:00:00'
