# ---------------------------------------------------------------------------
# Tile co-location -- Southern Ocean / Scotia Sea chunk
#
# Consumed by colocate_tiles.py, which reads the fronts build_v5 already made
# and writes into the same V5 tree.  Run build_v5 steps 1-3 first.
#
# Fields come from s3://dbof/LLC4320_RAW/CHUNKS/southern_ocean_scotia_sea/, which is already the
# tile's 720x720 extent -- nothing is sliced and no field is written to disk.
# The tile identity is read from that store's own provenance attrs.
#
# Per timestamp:
#   $OS_OGCM/LLC/Fronts/V5/SURF/{YYYYMMDD_HHMMSS}/tile{idx:03d}/
#       front_properties_{TS}_V5_bfronts.parquet
#
#   python colocate_tiles.py run_v5_tiles_scotia_sea.yaml
#
# Dates are the chunk store's snapshots that also have fronts: 20 of
# 31 in the store.  The store's hourly 2012-11-03 14:00-23:00 and
# 2012-11-04 00:00 have no fronts yet.
#
# Properties come from dbof.tiles.field_registry (52 available), NOT
# subset_definitions -- names are unsuffixed, co-location is at the surface.
# ---------------------------------------------------------------------------

pipeline: "SURF"

run:
  # Must match the build_v5 run that made the fronts: it is the filename tag
  # used to find the binary and label map under Fronts/V5/SURF/.
  run_id: "V5"
  log_dir: "./logs/"

build:
  # Front-finding config the fronts were made with.
  finding_config: "D"

  # Extra percentile columns per property.  Percentiles and the median are NOT
  # combinable across tiles, and a front clipped by the tile edge has
  # statistics for its clipped part only.
  percentiles: [25, 75, 90]

  tiles:
    - name: southern_ocean_scotia_sea
      chunk_name: southern_ocean_scotia_sea

  # Properties to co-locate, from dbof.tiles.field_registry.
  tile_properties:
    - density
    - gradb2
    - relative_vorticity
    - divergence
    - strain_mag
    - okubo_weiss
    - frontogenesis_tendency
    - N2
    - mixed_layer_depth

data:
  # ISO 'YYYY-MM-DD HH:MM:SS'.
  date_iterations:
    - '2012-10-31 12:00:00'
    - '2012-11-01 12:00:00'
    - '2012-11-02 12:00:00'
    - '2012-11-03 01:00:00'
    - '2012-11-03 02:00:00'
    - '2012-11-03 03:00:00'
    - '2012-11-03 04:00:00'
    - '2012-11-03 05:00:00'
    - '2012-11-03 06:00:00'
    - '2012-11-03 07:00:00'
    - '2012-11-03 08:00:00'
    - '2012-11-03 09:00:00'
    - '2012-11-03 10:00:00'
    - '2012-11-03 11:00:00'
    - '2012-11-03 12:00:00'
    - '2012-11-03 13:00:00'
    - '2012-11-04 12:00:00'
    - '2012-11-05 12:00:00'
    - '2012-11-06 12:00:00'
    - '2012-11-07 12:00:00'
